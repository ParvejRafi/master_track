databases:
  - name: mastertrack-db
    plan: free

services:
  - name: mastertrack-api
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mastertrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "mastertrack-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mastertrack.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mastertrack-api.onrender.com"

  - name: mastertrack
    type: web
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://mastertrack-api.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
